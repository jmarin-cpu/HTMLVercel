<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modo Claro/Oscuro</title>
<style>
body {
  font-family: Arial, sans-serif;
  margin: 20px;
  transition: background 0.3s, color 0.3s;
}

/* Modo oscuro por defecto del sistema */
@media (prefers-color-scheme: dark) {
  body {
    background: #121212;
    color: #e6e6e6;
  }
}

/* Modo claro por defecto del sistema */
@media (prefers-color-scheme: light) {
  body {
    background: #fff;
    color: #111;
  }
}

/* Clases para forzar el modo */
body.light {
  background: #fff;
  color: #111;
}

body.dark {
  background: #121212;
  color: #e6e6e6;
}

/* Estilos de botones */
.botones {
  margin-top: 20px;
}

button {
  padding: 10px 15px;
  margin-right: 10px;
  cursor: pointer;
}
</style>
</head>
<body>
  <h1>Ejemplo de Modo Claro y Oscuro</h1>
  <p>Este texto cambia según la preferencia del sistema o los botones.</p>

  <div class="botones">
    <button id="btn-light">Forzar Claro</button>
    <button id="btn-dark">Forzar Oscuro</button>
    <button id="btn-auto">Automático</button>
  </div>
</body>
<script>
    const btnLight = document.getElementById("btn-light");
    const btnDark = document.getElementById("btn-dark");
    const btnAuto = document.getElementById("btn-auto");

    btnLight.addEventListener("click", () => {
        document.body.classList.add("light");
        document.body.classList.remove("dark");
    });

    btnDark.addEventListener("click", () => {
        document.body.classList.add("dark");
        document.body.classList.remove("light");
    });

    btnAuto.addEventListener("click", () => {
        document.body.classList.remove("light");
        document.body.classList.remove("dark");
    });
</script>
</html>
